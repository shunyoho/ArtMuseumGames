<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>美館闖關趣</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261024.2">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">美</span><div>美館闖關趣<small>活動位置:高雄市立美術館</small></div></div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="hero-icons" id="heroIcons"></div>
      <h1>五關集章挑戰</h1>
      <p>完成任務、找關主掃 QR code，集滿五枚印章！</p>
    </section>

    <section class="card">
      <div class="tabs" role="tablist">
        <button type="button" class="active" data-tab="login">登入</button>
        <button type="button" data-tab="signup">註冊</button>
      </div>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email" required>
        <label for="loginPw">密碼</label>
        <input id="loginPw" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">登入開始闖關</button>
      </form>

      <form id="signupForm" hidden>
        <label for="signName">暱稱</label>
        <input id="signName" type="text" maxlength="20" required>
        <div class="hint">會顯示在你的闖關頁上</div>
        <label for="signEmail">Email</label>
        <input id="signEmail" type="email" autocomplete="email" required>
        <label for="signPw">密碼</label>
        <input id="signPw" type="password" autocomplete="new-password" minlength="6" required>
        <div class="hint">至少 6 碼</div>
        <button class="btn" type="submit">註冊</button>
      </form>

      <div id="msg" class="notice" hidden></div>
    </section>

    <p class="footnote">必須先註冊並登入，才能進入闖關頁</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=20261024.2"></script>
  <script src="js/app.js?v=20261024.2"></script>
  <script>
    const next = safeNext(new URLSearchParams(location.search).get('next'), 'game.html');
    const msg = document.getElementById('msg');

    document.getElementById('heroIcons').innerHTML =
      ['palette', 'sculpture', 'camera', 'leaf', 'frame'].map((k) => `<span>${icon(k)}</span>`).join('');

    // 已經登入就直接進闖關頁
    db.auth.getSession().then(({ data: { session } }) => { if (session) location.replace(next); });

    document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('active', x === b));
      document.getElementById('loginForm').hidden = b.dataset.tab !== 'login';
      document.getElementById('signupForm').hidden = b.dataset.tab !== 'signup';
      msg.hidden = true;
    }));

    function show(text) { msg.textContent = text; msg.hidden = false; }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.submitter; btn.disabled = true;
      const { error } = await db.auth.signInWithPassword({
        email: loginEmail.value.trim(), password: loginPw.value,
      });
      btn.disabled = false;
      if (error) return show(error.message === 'Invalid login credentials' ? 'Email 或密碼錯誤' : error.message);
      location.replace(next);
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.submitter; btn.disabled = true;
      const { data, error } = await db.auth.signUp({
        email: signEmail.value.trim(),
        password: signPw.value,
        options: { data: { display_name: signName.value.trim() } },
      });
      btn.disabled = false;
      if (error) return show(error.message);
      // Confirm email 開著時不會直接拿到 session，要先去收驗證信
      if (!data.session) return show('註冊成功！請到信箱點擊驗證信，再回來登入。');
      location.replace(next);
    });
  </script>
</body>
</html>
